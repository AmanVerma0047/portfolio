        @font-face {
            font-family: "Mononoki";
            src: url("./mononoki-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        .editor>* {
            box-sizing: border-box;
            margin: 0;
            font: 400 18px/30px "Mononoki", monospace;
        }

        body {
            margin: 0;
        }

        .editor {
            display: flex;
            width: 100%;
            height: 100dvh;
            box-sizing: border-box;
        }

        #code:focus {
            outline: none;
        }

        .editor:focus-within {
            outline: 1px solid #888;
            outline-offset: -1px;
        }

        #code {
            flex: 1;
            min-width: 0;

            cursor: text;
            /* I-beam when hovering */
            caret-color: #258beb;
            /* Blue blinking caret */
            caret-shape: block;
        }

        #line-numbers {
            flex: 0 0 auto;
            min-width: calc(2ch + 12px);
            padding: 4px 4px 4px 8px;
            overflow: hidden;
            white-space: pre;
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: #808080;
            user-select: none;
        }

        #code {
            flex: 1;
            min-width: 0;
            padding: 4px 8px 4px 0;
            border: 0;
            background: transparent;
            resize: none;
            overflow: auto;
        }

        #bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0;
            /* Remove the default <p> margin */
            line-height: 25px;

            /* Center the text vertically */
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .portfolio {
            padding-bottom: 25px;
            /* Keep the last row clear of the bar */
        }

        ::selection {
            background-color: rgb(0, 140, 255);
            color: white;
        }

        .bar-status {
            margin-inline-start: auto;
            color: #85ceeb;
        }
    </style>
</head>

    <script>
        const textarea = document.querySelector('#code');
        const gutter = document.querySelector('#line-numbers');

        function syncScroll() {
            gutter.scrollTop = textarea.scrollTop;
        }

        function updateLineNumbers() {
            const count = textarea.value.split('\n').length;
            gutter.textContent = Array.from({ length: count }, (_, i) => i + 1).join('\n');
            syncScroll();
        }

        textarea.addEventListener('input', updateLineNumbers);
        textarea.addEventListener('scroll', syncScroll);
        updateLineNumbers();
    </script>
